<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Flock · Shader</title>
<meta name="description" content="Neon Flock demo: Real-time GPU fragment shader.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://evirtual.github.io/neon-flock/">
<meta name="theme-color" content="#05060f">
<style>
  @view-transition { navigation: auto; }
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#cfe}
  canvas{display:block;width:100vw;height:100vh;animation:fadein 1.6s ease both}
  @keyframes fadein{from{opacity:0;filter:blur(24px);transform:scale(1.08)}to{opacity:1;filter:none;transform:none}}
  .box{position:fixed;left:16px;top:16px;padding:10px 14px;background:#0007;border:1px solid #fff3;border-radius:12px;backdrop-filter:blur(8px)}
  a{color:#fff;text-decoration:none;opacity:.8;transition:opacity .3s,letter-spacing .3s}
  a:hover{opacity:1;letter-spacing:.05em}
  small{display:block;opacity:.6;margin-top:4px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="box"><a href="index.html">← Back to flock</a><small>Fragment shader · runs on your GPU · move the mouse</small></div>
<script>
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl');
const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs = `precision highp float;
uniform vec2 r;uniform vec2 m;uniform float t;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<6;i++){v+=a*n(p);p=p*2.02+vec2(1.7,9.2);a*=.5;}return v;}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;
  vec2 mu=(m-.5*r)/r.y;
  vec2 q=uv*2.2;
  float d=length(uv-mu);
  q+=normalize(uv-mu+1e-4)*.35*exp(-d*3.);
  vec2 w=vec2(fbm(q+t*.08),fbm(q+vec2(5.2,1.3)-t*.06));
  float f=fbm(q+3.*w+t*.05);
  vec3 c=.5+.5*cos(6.2831*(f*1.2+vec3(0.,.33,.67)+t*.03));
  c*=smoothstep(.15,.9,f)*1.5;
  c+=vec3(.3,.7,1.)*exp(-d*6.)*.6;
  c*=1.-.5*dot(uv,uv);
  gl_FragColor=vec4(pow(c,vec3(.9)),1.);
}`;
function sh(type, src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog);gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={r:gl.getUniformLocation(prog,'r'),m:gl.getUniformLocation(prog,'m'),t:gl.getUniformLocation(prog,'t')};
const mouse={x:innerWidth*.5,y:innerHeight*.5,tx:innerWidth*.5,ty:innerHeight*.5};
let quality=1;
function resize(){const d=Math.min(devicePixelRatio||1,1.5)*quality;const ow=canvas.width||innerWidth*d;canvas.width=innerWidth*d;canvas.height=innerHeight*d;
  const k=canvas.width/ow;mouse.x*=k;mouse.tx*=k;mouse.y*=k;mouse.ty*=k;
  gl.viewport(0,0,canvas.width,canvas.height);}
addEventListener('resize',resize);resize();
addEventListener('pointermove',e=>{const d=canvas.width/innerWidth;mouse.tx=e.clientX*d;mouse.ty=canvas.height-e.clientY*d;});
let lastMs=0,avg=16;
function adapt(ms){
  if(lastMs){avg+=(Math.min(ms-lastMs,100)-avg)*.05;}
  lastMs=ms;
  if(avg>22&&quality>0.3){quality=Math.max(0.3,quality*.88);avg=16;resize();}
  else if(avg<12&&quality<1){quality=Math.min(1,quality*1.06);avg=14;resize();}
}
function frame(ms){
  adapt(ms);
  mouse.x+=(mouse.tx-mouse.x)*.08;mouse.y+=(mouse.ty-mouse.y)*.08;
  gl.uniform2f(U.r,canvas.width,canvas.height);
  gl.uniform2f(U.m,mouse.x,mouse.y);
  gl.uniform1f(U.t,ms/1000);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
