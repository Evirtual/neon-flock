<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mandelbulb</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#cfe}
  canvas{display:block;width:100vw;height:100vh;cursor:grab}
  .box{position:fixed;left:16px;top:70px;padding:10px 14px;background:#0007;border:1px solid #fff3;border-radius:12px;backdrop-filter:blur(8px);font-size:13px}
  small{display:block;opacity:.6;margin-top:4px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="box">Raymarched Mandelbulb<small>Real 3D fractal, computed per pixel on your GPU · drag or move the mouse to orbit · the shape morphs over time</small></div>
<script>
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl');
const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs = `precision highp float;
uniform vec2 r;uniform vec2 m;uniform float t;
float de(vec3 p,out float trap){
  vec3 z=p;float dr=1.,rr=0.;trap=1e9;
  float power=6.+2.*sin(t*.2);
  for(int i=0;i<8;i++){
    rr=length(z);if(rr>2.)break;
    trap=min(trap,rr);
    float th=acos(z.z/rr),ph=atan(z.y,z.x);
    dr=pow(rr,power-1.)*power*dr+1.;
    float zr=pow(rr,power);th*=power;ph*=power;
    z=zr*vec3(sin(th)*cos(ph),sin(ph)*sin(th),cos(th))+p;
  }
  return .5*log(rr)*rr/dr;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;
  float a=t*.1+(m.x/r.x-.5)*6.28;
  float b=(m.y/r.y-.5)*3.;
  vec3 ro=2.6*vec3(cos(a)*cos(b),sin(b),sin(a)*cos(b));
  vec3 f=normalize(-ro),rt=normalize(cross(f,vec3(0.,1.,0.))),up=cross(rt,f);
  vec3 rd=normalize(f*1.6+uv.x*rt+uv.y*up);
  float d=0.,tr=0.,steps=0.,trapv=0.;bool hit=false;
  for(int i=0;i<90;i++){
    vec3 p=ro+rd*d;
    float h=de(p,tr);
    steps=float(i);
    if(h<.0015){hit=true;trapv=tr;break;}
    d+=h;
    if(d>6.)break;
  }
  vec3 col;
  if(hit){
    vec3 base=.5+.5*cos(6.2831*(trapv*1.5+vec3(0.,.33,.67)+t*.02));
    float ao=1.-steps/90.;
    col=base*(.25+1.4*ao*ao);
  }else{
    col=.04+.1*vec3(.3,.2,.6)*(1.-length(uv))+vec3(.3,.5,1.)*pow(steps/90.,2.)*1.2;
  }
  gl_FragColor=vec4(pow(col,vec3(.85)),1.);
}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog);gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={r:gl.getUniformLocation(prog,'r'),m:gl.getUniformLocation(prog,'m'),t:gl.getUniformLocation(prog,'t')};
const mouse={x:0,y:0,tx:0,ty:0};
// render below native resolution: the fractal is expensive per pixel
function resize(){const d=Math.min(devicePixelRatio||1,1)*.6;canvas.width=innerWidth*d;canvas.height=innerHeight*d;
  gl.viewport(0,0,canvas.width,canvas.height);mouse.x=mouse.tx=canvas.width/2;mouse.y=mouse.ty=canvas.height/2;}
addEventListener('resize',resize);resize();
addEventListener('pointermove',e=>{const d=canvas.width/innerWidth;mouse.tx=e.clientX*d;mouse.ty=canvas.height-e.clientY*d;});
function frame(ms){
  mouse.x+=(mouse.tx-mouse.x)*.06;mouse.y+=(mouse.ty-mouse.y)*.06;
  gl.uniform2f(U.r,canvas.width,canvas.height);
  gl.uniform2f(U.m,mouse.x,mouse.y);
  gl.uniform1f(U.t,ms/1000);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
