<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pure CSS</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;background:#0a0a1f}
  .bg{position:fixed;inset:-20%;filter:blur(60px) saturate(1.5)}
  .bg i{position:absolute;width:45vmax;height:45vmax;border-radius:50%;opacity:.8;animation:float 18s ease-in-out infinite alternate}
  .bg i:nth-child(1){background:#ff3d81;left:5%;top:0}
  .bg i:nth-child(2){background:#3d7bff;right:0;top:20%;animation-duration:23s;animation-delay:-6s}
  .bg i:nth-child(3){background:#35f2c0;left:30%;bottom:-10%;animation-duration:27s;animation-delay:-12s}
  @keyframes float{0%{transform:translate(0,0) scale(1)}50%{transform:translate(12vw,-8vh) scale(1.25)}100%{transform:translate(-10vw,10vh) scale(.9)}}
  main{position:relative;height:100%;display:grid;place-items:center}
  .cards{display:grid;grid-template-columns:repeat(3,200px);gap:20px;perspective:900px}
  .card{height:260px;border-radius:22px;background:#ffffff14;border:1px solid #ffffff30;backdrop-filter:blur(18px);display:grid;place-items:center;font-size:20px;letter-spacing:.04em;
    animation:rise .9s cubic-bezier(.2,.9,.3,1.2) both;transition:transform .6s cubic-bezier(.2,.9,.3,1),box-shadow .6s,background .6s}
  .card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.24s}
  @keyframes rise{from{opacity:0;transform:translateY(60px) rotateX(25deg)}to{opacity:1;transform:none}}
  .card:hover{transform:translateY(-14px) rotateY(-10deg) scale(1.05);background:#ffffff26;box-shadow:0 30px 60px #0008,0 0 40px #ffffff22}
  .card::before{content:"";position:absolute;width:90px;height:90px;border-radius:50%;margin-top:-110px;background:conic-gradient(from 0deg,#ff3d81,#ffd23d,#35f2c0,#3d7bff,#ff3d81);animation:spin 6s linear infinite;mask:radial-gradient(circle,transparent 55%,#000 57%)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .card span{margin-top:90px}
  h1{position:fixed;top:70px;width:100%;text-align:center;margin:0;font-weight:300;font-size:14px;opacity:.7;letter-spacing:.3em;text-transform:uppercase}
  @media (max-width:760px){.cards{grid-template-columns:1fr;width:220px}.card{height:120px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<h1>Pure CSS · zero JavaScript</h1>
<main>
  <div class="cards">
    <div class="card"><span>Blur</span></div>
    <div class="card"><span>Depth</span></div>
    <div class="card"><span>Motion</span></div>
  </div>
</main>
</body>
</html>
