<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Lab</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;font-family:system-ui,sans-serif;color:#cfe}
  nav{position:fixed;z-index:10;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:#000a;border:1px solid #fff2;border-radius:999px;backdrop-filter:blur(10px);animation:drop .9s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes drop{from{opacity:0;transform:translate(-50%,-30px)}to{opacity:1;transform:translate(-50%,0)}}
  nav button{all:unset;cursor:pointer;padding:8px 16px;border-radius:999px;font-size:13px;color:#cfe9;position:relative;z-index:1;transition:color .3s}
  nav button:hover{color:#fff}
  nav button.on{color:#000}
  #pill{position:absolute;top:5px;bottom:5px;left:0;width:0;background:linear-gradient(90deg,#5ff,#a6f);border-radius:999px;transition:transform .5s cubic-bezier(.2,.9,.3,1),width .5s cubic-bezier(.2,.9,.3,1);box-shadow:0 0 24px #5ff6}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;filter:blur(14px);transform:scale(1.04);pointer-events:none;transition:opacity .7s ease,filter .7s ease,transform .7s ease}
  iframe.on{opacity:1;filter:none;transform:none;pointer-events:auto}
  #hint{position:fixed;z-index:10;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.5}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<nav id="nav"><span id="pill"></span></nav>
<div id="stage"></div>
<div id="hint">Click a tab or press 1–4</div>
<script>
const demos = [
  { id: 'flock',  label: 'Flock',        src: 'flock.html' },
  { id: 'shader', label: 'GPU Shader',   src: 'shader.html' },
  { id: 'three',  label: 'Three.js 3D',  src: 'three.html' },
  { id: 'css',    label: 'Pure CSS',     src: 'css.html' },
];
const nav = document.getElementById('nav'), stage = document.getElementById('stage'), pill = document.getElementById('pill');
const frames = {}, buttons = {};

function movePill(btn) {
  pill.style.width = btn.offsetWidth + 'px';
  pill.style.transform = `translateX(${btn.offsetLeft}px)`;
}

function show(id) {
  const d = demos.find(x => x.id === id) || demos[0];
  for (const x of demos) {
    buttons[x.id].classList.toggle('on', x === d);
    if (frames[x.id]) frames[x.id].classList.toggle('on', x === d);
  }
  if (!frames[d.id]) {
    const f = document.createElement('iframe');
    f.src = d.src;
    f.title = d.label;
    // demo pages link back to this hub; hide that link when embedded
    f.addEventListener('load', () => { f.contentDocument?.querySelector('.box a')?.remove(); });
    stage.appendChild(f);
    frames[d.id] = f;
    requestAnimationFrame(() => requestAnimationFrame(() => f.classList.add('on')));
  }
  movePill(buttons[d.id]);
  history.replaceState(null, '', '#' + d.id);
}

demos.forEach((d, i) => {
  const b = document.createElement('button');
  b.textContent = d.label;
  b.onclick = () => show(d.id);
  nav.appendChild(b);
  buttons[d.id] = b;
});
addEventListener('keydown', e => { const d = demos[+e.key - 1]; if (d) show(d.id); });
addEventListener('resize', () => { const on = nav.querySelector('.on'); if (on) movePill(on); });
document.fonts.ready.then(() => show(location.hash.slice(1)));
</script>
</body>
</html>
