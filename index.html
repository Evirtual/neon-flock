<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;font-family:system-ui,sans-serif;color:#cfe}
  nav{position:fixed;z-index:10;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;max-width:94vw;overflow-x:auto;scrollbar-width:none;background:#000a;border:1px solid #fff2;border-radius:999px;backdrop-filter:blur(10px);animation:drop .9s cubic-bezier(.2,.9,.3,1.2) both}
  nav::-webkit-scrollbar{display:none}
  @keyframes drop{from{opacity:0;transform:translate(-50%,-30px)}to{opacity:1;transform:translate(-50%,0)}}
  nav button{all:unset;cursor:pointer;padding:8px 16px;border-radius:999px;font-size:13px;white-space:nowrap;color:#cfe9;position:relative;z-index:1;transition:color .3s}
  nav button:hover{color:#fff}
  nav button.on{color:#000}
  nav button.tour{margin-left:6px;border:1px solid #fff3;padding:7px 14px}
  nav button.tour.running{border-color:#5ff;color:#5ff;box-shadow:0 0 18px #5ff5}
  #pill{position:absolute;top:5px;bottom:5px;left:0;width:0;background:linear-gradient(90deg,#5ff,#a6f);border-radius:999px;transition:transform .5s cubic-bezier(.2,.9,.3,1),width .5s cubic-bezier(.2,.9,.3,1);box-shadow:0 0 24px #5ff6}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;filter:blur(14px);transform:scale(1.04);pointer-events:none;transition:opacity .7s ease,filter .7s ease,transform .7s ease}
  iframe.on{opacity:1;filter:none;transform:none;pointer-events:auto}
  #bar{position:fixed;z-index:10;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,#5ff,#a6f);box-shadow:0 0 12px #5ff}
  #hint{position:fixed;z-index:10;bottom:8px;right:14px;font-size:12px;opacity:.45;pointer-events:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<nav id="nav"><span id="pill"></span></nav>
<div id="stage"></div>
<div id="bar"></div>
<div id="hint">Click a tab or press 1–6</div>
<script>
const demos = [
  { id: 'flock',   label: 'Flock',         src: 'flock.html' },
  { id: 'shader',  label: 'GPU Shader',    src: 'shader.html' },
  { id: 'fractal', label: '3D Fractal',    src: 'fractal.html' },
  { id: 'text',    label: 'Particle Text', src: 'text.html' },
  { id: 'three',   label: 'Galaxies',      src: 'three.html' },
  { id: 'css',     label: 'CSS Playground', src: 'css.html' },
];
const TOUR_MS = 9000;
const nav = document.getElementById('nav'), stage = document.getElementById('stage'), pill = document.getElementById('pill'), bar = document.getElementById('bar');
const frames = {}, buttons = {};
let current = null, tour = null;

function movePill(btn) {
  pill.style.width = btn.offsetWidth + 'px';
  pill.style.transform = `translateX(${btn.offsetLeft}px)`;
}

function show(id) {
  const d = demos.find(x => x.id === id) || demos[0];
  if (current === d.id && frames[d.id]) return;
  current = d.id;
  for (const x of demos) buttons[x.id].classList.toggle('on', x === d);
  // only one demo runs at a time: fade the old one out, then destroy it to free the GPU
  for (const k in frames) {
    const old = frames[k];
    delete frames[k];
    old.classList.remove('on');
    setTimeout(() => { old.src = 'about:blank'; old.remove(); }, 750);
  }
  const f = document.createElement('iframe');
  f.src = d.src + '?v=1793328575';
  f.title = d.label;
  stage.appendChild(f);
  frames[d.id] = f;
  requestAnimationFrame(() => requestAnimationFrame(() => f.classList.add('on')));
  movePill(buttons[d.id]);
  buttons[d.id].scrollIntoView({ inline: 'center', block: 'nearest' });
  history.replaceState(null, '', '#' + d.id);
}

function stopTour() {
  if (!tour) return;
  clearInterval(tour.timer); cancelAnimationFrame(tour.raf);
  tour = null;
  tourBtn.textContent = '▶ Tour';
  tourBtn.classList.remove('running');
  bar.style.width = '0';
}

function startTour() {
  stopTour();
  tour = { start: performance.now() };
  tourBtn.textContent = '❚❚ Stop';
  tourBtn.classList.add('running');
  const tick = () => {
    const p = ((performance.now() - tour.start) % TOUR_MS) / TOUR_MS;
    bar.style.width = p * 100 + '%';
    tour.raf = requestAnimationFrame(tick);
  };
  tick();
  tour.timer = setInterval(() => {
    const i = demos.findIndex(x => x.id === current);
    show(demos[(i + 1) % demos.length].id);
  }, TOUR_MS);
}

demos.forEach(d => {
  const b = document.createElement('button');
  b.textContent = d.label;
  b.onclick = () => { stopTour(); show(d.id); };
  nav.appendChild(b);
  buttons[d.id] = b;
});
const tourBtn = document.createElement('button');
tourBtn.className = 'tour';
tourBtn.textContent = '▶ Tour';
tourBtn.onclick = () => (tour ? stopTour() : startTour());
nav.appendChild(tourBtn);

addEventListener('keydown', e => {
  const d = demos[+e.key - 1];
  if (d) { stopTour(); show(d.id); }
});
addEventListener('resize', () => { if (current) movePill(buttons[current]); });
document.fonts.ready.then(() => show(location.hash.slice(1)));
</script>
</body>
